[cleanup]
script = '''
# 1. Clear application and configuration caches
php artisan config:clear
php artisan cache:clear

# 2. Safely remove the worktree-specific SQLite database
$dbPath = "database/database.sqlite"
if (Test-Path $dbPath) {
    Remove-Item $dbPath -Force
}

# 3. Optional: Wipe front-end build and dependencies if aggressive space-saving is needed
# Remove-Item -Recurse -Force node_modules, public/build'''

