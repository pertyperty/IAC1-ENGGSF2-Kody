# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "main"

[setup]
script = '''
# 1. Environment file setup
if (-not (Test-Path .env)) {
    Copy-Item .env.example .env
}

# 2. Install PHP and Composer dependencies
composer install --no-interaction --prefer-dist --optimize-autoloader

# 3. Generate application key
php artisan key:generate

# 4. Local SQLite database lifecycle (Ensures per-worktree isolation)
$dbPath = "database/database.sqlite"
if (-not (Test-Path $dbPath)) {
    New-Item -Path $dbPath -ItemType File
}

# 5. Run migrations and database seeding
php artisan migrate:seed --force

# 6. Frontend assets installation & build
npm install
npm run build'''

[setup.win32]
script = '''
# 1. Environment file setup
